name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Crear proyecto
        run: |
          mkdir -p proj && cd proj
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TextoBloqueo"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.textobloqueo"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.textobloqueo"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SET_WALLPAPER" />
              <application
                  android:label="Texto de bloqueo"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/textobloqueo
          cat > app/src/main/java/com/example/textobloqueo/MainActivity.kt <<'EOF_FILE'
          package com.example.textobloqueo

          import android.app.Activity
          import android.app.WallpaperManager
          import android.graphics.*
          import android.os.Bundle
          import android.text.Layout
          import android.text.StaticLayout
          import android.text.TextPaint
          import android.text.TextWatcher
          import android.text.Editable
          import android.view.Gravity
          import android.view.View
          import android.widget.*

          class MainActivity : Activity() {

              private val textColors = intArrayOf(
                  Color.WHITE, Color.BLACK, 0xFFFFD166.toInt(), 0xFFFF6B6B.toInt(), 0xFF7BDFF2.toInt()
              )
              private val backgrounds = arrayOf(
                  intArrayOf(0xFF2B3A67.toInt(), 0xFF0F1226.toInt()),
                  intArrayOf(0xFFF4D58D.toInt(), 0xFFE07A5F.toInt()),
                  intArrayOf(0xFF1B4332.toInt(), 0xFF081C15.toInt()),
                  intArrayOf(0xFF000000.toInt(), 0xFF000000.toInt()),
                  intArrayOf(0xFFFFFFFF.toInt(), 0xFFDDDDDD.toInt())
              )

              private var textColor = Color.WHITE
              private var bg = backgrounds[0]
              private var sizeVal = 70
              private var posVal = 60
              private var align = Layout.Alignment.ALIGN_CENTER
              private var bold = false

              private lateinit var preview: ImageView
              private lateinit var edit: EditText

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("lock", MODE_PRIVATE)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(24))
                  }
                  val scroll = ScrollView(this).apply { addView(root) }
                  setContentView(scroll)

                  root.addView(TextView(this).apply {
                      text = "Texto para tu pantalla de bloqueo"
                      textSize = 20f
                      setTypeface(null, Typeface.BOLD)
                  })

                  preview = ImageView(this).apply { adjustViewBounds = true }
                  val pw = dp(170)
                  val dm = resources.displayMetrics
                  root.addView(preview, LinearLayout.LayoutParams(pw, pw * dm.heightPixels / dm.widthPixels).apply {
                      gravity = Gravity.CENTER_HORIZONTAL; topMargin = dp(12); bottomMargin = dp(12)
                  })

                  edit = EditText(this).apply {
                      setText(prefs.getString("text", "Respira.\nTodo va bien."))
                      hint = "Escribe tu texto"
                      minLines = 3
                      gravity = Gravity.TOP
                      addTextChangedListener(object : TextWatcher {
                          override fun afterTextChanged(s: Editable?) = refresh()
                          override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                          override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      })
                  }
                  root.addView(edit)

                  root.addView(label("Tamaño"))
                  root.addView(slider(20, 160, sizeVal) { sizeVal = it })
                  root.addView(label("Posición vertical"))
                  root.addView(slider(10, 90, posVal) { posVal = it })

                  root.addView(label("Alineación"))
                  root.addView(buttonRow(
                      "Izquierda" to { align = Layout.Alignment.ALIGN_NORMAL; refresh() },
                      "Centro" to { align = Layout.Alignment.ALIGN_CENTER; refresh() },
                      "Derecha" to { align = Layout.Alignment.ALIGN_OPPOSITE; refresh() },
                      "Negrita" to { bold = !bold; refresh() }
                  ))

                  root.addView(label("Color del texto"))
                  root.addView(swatches(textColors.map { intArrayOf(it, it) }) { textColor = it[0]; refresh() })
                  root.addView(label("Fondo"))
                  root.addView(swatches(backgrounds.toList()) { bg = it; refresh() })

                  root.addView(Button(this).apply {
                      text = "Poner en pantalla de bloqueo"
                      setOnClickListener { applyToLockScreen(prefs.edit()) }
                  }, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(20) })

                  refresh()
              }

              private fun label(t: String) = TextView(this).apply {
                  text = t; setPadding(0, dp(12), 0, dp(4))
              }

              private fun slider(min: Int, max: Int, start: Int, onChange: (Int) -> Unit) =
                  SeekBar(this).apply {
                      this.max = max - min
                      progress = start - min
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { onChange(p + min); refresh() }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }

              private fun buttonRow(vararg items: Pair<String, () -> Unit>) = LinearLayout(this).apply {
                  items.forEach { (t, a) ->
                      addView(Button(context).apply {
                          text = t; textSize = 11f; isAllCaps = false
                          setOnClickListener { a() }
                      }, LinearLayout.LayoutParams(0, -2, 1f))
                  }
              }

              private fun swatches(colors: List<IntArray>, onPick: (IntArray) -> Unit) = LinearLayout(this).apply {
                  colors.forEach { c ->
                      addView(View(context).apply {
                          background = android.graphics.drawable.GradientDrawable(
                              android.graphics.drawable.GradientDrawable.Orientation.TOP_BOTTOM, c
                          ).apply { cornerRadius = dp(10).toFloat(); setStroke(dp(1), 0x55888888) }
                          setOnClickListener { onPick(c) }
                      }, LinearLayout.LayoutParams(0, dp(44), 1f).apply { setMargins(dp(4), 0, dp(4), 0) })
                  }
              }

              private fun render(w: Int, h: Int): Bitmap {
                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bmp)
                  val p = Paint().apply { shader = LinearGradient(0f, 0f, 0f, h.toFloat(), bg[0], bg[1], Shader.TileMode.CLAMP) }
                  c.drawRect(0f, 0f, w.toFloat(), h.toFloat(), p)
                  val tp = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = textColor
                      textSize = sizeVal * w / 1080f
                      typeface = if (bold) Typeface.DEFAULT_BOLD else Typeface.DEFAULT
                      setShadowLayer(textSize * 0.15f, 0f, textSize * 0.04f, 0x66000000)
                  }
                  val text = edit.text.toString().ifEmpty { " " }
                  val tw = (w * 0.8f).toInt()
                  val layout = StaticLayout.Builder.obtain(text, 0, text.length, tp, tw)
                      .setAlignment(align).build()
                  c.save()
                  c.translate(w * 0.1f, h * posVal / 100f - layout.height / 2f)
                  layout.draw(c)
                  c.restore()
                  return bmp
              }

              private fun refresh() {
                  if (!::preview.isInitialized || !::edit.isInitialized) return
                  val dm = resources.displayMetrics
                  preview.setImageBitmap(render(dm.widthPixels / 3, dm.heightPixels / 3))
              }

              private fun applyToLockScreen(e: android.content.SharedPreferences.Editor) {
                  val dm = resources.displayMetrics
                  try {
                      val bmp = render(dm.widthPixels, dm.heightPixels)
                      WallpaperManager.getInstance(this)
                          .setBitmap(bmp, null, true, WallpaperManager.FLAG_LOCK)
                      e.putString("text", edit.text.toString()).apply()
                      Toast.makeText(this, "Listo: bloquea el móvil para verlo", Toast.LENGTH_LONG).show()
                  } catch (ex: Exception) {
                      Toast.makeText(this, "No se pudo cambiar el fondo: ${ex.message}", Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF_FILE
      - name: Compilar
        run: cd proj && gradle assembleDebug --no-daemon
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk TextoBloqueo.apk
          gh release create "v${{ github.run_number }}" TextoBloqueo.apk --repo "${{ github.repository }}" --title "APK v${{ github.run_number }}" --notes "Descarga TextoBloqueo.apk"
