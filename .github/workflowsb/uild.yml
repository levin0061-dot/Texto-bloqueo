nombre: Comppilar APK
en:
  flujo_de_trabajo:
  empujar:
    ramas: [principal]
permisos:
  Contenido: escribir
empleos:
  construir:
    runs-on: ubuntu-latest
    pasos:
      - usos: actions/setup-java@v4
        con:
          distribución: temurin
          versión de Java: '17'
      - utiliza: gradle/actions/setup-gradle@v4
        con:
          versión de Gradle: '8.9'
      - nombre: Crear proyecto
        correr: |
          mkdir -p proj && cd proj
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositorios { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositorios { google(); mavenCentral() } }
          rootProject.nombre = "TextoBloqueo"
          incluir(":aplicación")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          complementos {
              id("com.android.application") versión "8.5.2" aplicar falso
              id("org.jetbrains.kotlin.android") versión "1.9.24" aplicar falso
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          complementos {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          Android {
              espacio de nombres = "com.example.textobloqueo"
              compileSdk = 34
              Configuración predeterminada {
                  applicationId = "com.example.textobloqueo"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              opciones de compilación {
                  Compatibilidad de origen = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SET_WALLPAPER" />
              <aplicación
                  android:label="Texto de bloqueo"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <filtro-de-intención>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </actividad>
              </aplicación>
          </manifiesto>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/textobloqueo
          cat > app/src/main/java/com/example/textobloqueo/MainActivity.kt <<'EOF_FILE'
          paquete com.example.textobloqueo

          importar android.app.Activity
          import android.app.WallpaperManager
          import android.graphics.*
          importar android.os.Bundle
          import android.text.Layout
          import android.text.StaticLayout
          import android.text.TextPaint
          import android.text.TextWatcher
          importar android.text.Editable
          import android.view.Gravity
          import android.view.View
          import android.widget.*

          clase MainActivity : Activity() {

              privado val textColors = intArrayOf(
                  Color.BLANCO, Color.NEGRO, 0xFFFFD166.toInt(), 0xFFFF6B6B.toInt(), 0xFF7BDFF2.toInt()
              )
              fondo privado val = arrayOf(
                  intArrayOf(0xFF2B3A67.toInt(), 0xFF0F1226.toInt()),
                  intArrayOf(0xFFF4D58D.toInt(), 0xFFE07A5F.toInt()),
                  intArrayOf(0xFF1B4332.toInt(), 0xFF081C15.toInt()),
                  intArrayOf(0xFF000000.toInt(), 0xFF000000.toInt()),
                  intArrayOf(0xFFFFFFFF.toInt(), 0xFFDDDDDD.toInt())
              )

              variable privada textColor = Color.WHITE
              var privada bg = fondos[0]
              variable privada sizeVal = 70
              variable privada posVal = 60
              var privada align = Layout.Alignment.ALIGN_CENTER
              var privada negrita = falso

              private lateinit var preview: ImageView
              edición privada de lateinit var: EditText

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              anular la función onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("lock", MODE_PRIVATE)

                  val root = LinearLayout(this).apply {
                      orientación = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(24))
                  }
                  val scroll = ScrollView(this).apply { addView(root) }
                  establecerContentView(desplazamiento)

                  raíz.addView(TextView(this).apply {
                      text = "Texto para tu pantalla de bloqueo"
                      textSize = 20f
                      setTypeface(null, Typeface.BOLD)
                  })

                  preview = ImageView(this).apply { adjustViewBounds = true }
                  val pw = dp(170)
                  val dm = resources.displayMetrics
                  raíz.addView(preview, LinearLayout.LayoutParams(pw, pw * dm.heightPixels / dm.widthPixels).apply {
                      gravedad = Gravedad.CENTRO_HORIZONTAL; margensuperior = dp(12); margeninferior = dp(12)
                  })

                  editar = EditText(this).apply {
                      setText(prefs.getString("text", "Respira.\nTodo va bien."))
                      hint = "Escribe tu texto"
                      minLines = 3
                      gravedad = Gravedad.TOP
                      addTextChangedListener(object : TextWatcher {
                          override fun afterTextChanged(s: Editable?) = refresh()
                          override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                          override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                      })
                  }
                  raíz.addView(editar)

                  root.addView(label("Tamaño"))
                  raíz.addView(slider(20, 160, sizeVal) { sizeVal = it })
                  root.addView(label("Posición vertical"))
                  raíz.addView(slider(10, 90, posVal) { posVal = it })

                  root.addView(label("Alineación"))
                  raíz.addView(buttonRow(
                      "Izquierda" a { align = Layout.Alignment.ALIGN_NORMAL; refresh() },
                      "Centro" a { align = Layout.Alignment.ALIGN_CENTER; refresh() },
                      "Derecha" a { align = Layout.Alignment.ALIGN_OPPOSITE; refresh() },
                      "Negrita" a { negrita = !negrita; actualizar() }
                  ))

                  root.addView(label("Color del texto"))
                  raíz.addView(swatches(textColors.map { intArrayOf(it, it) }) { textColor = it[0]; refresh() })
                  raíz.addView(etiqueta("Fondo"))
                  raíz.addView(swatches(backgrounds.toList()) { bg = it; refresh() })

                  raíz.addView(Button(this).apply {
                      text = "Poner en pantalla de bloqueo"
                      setOnClickListener { applyToLockScreen(prefs.edit()) }
                  }, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(20) })

                  refrescar()
              }

              private fun label(t: String) = TextView(this).apply {
                  texto = t; setPadding(0, dp(12), 0, dp(4))
              }

              fun privada deslizadora(mín: Int, máx: Int, inicio: Int, al cambiar: (Int) -> Unidad) =
                  SeekBar(this).apply {
                      esto.máximo = máximo - mínimo
                      progreso = inicio - min
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, u: Boolean) { onChange(p + min); refresh() }
                          anular la función onStartTrackingTouch(s: SeekBar?) {}
                          anular la función onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }

              private fun buttonRow(vararg items: Pair<String, () -> Unit>) = LinearLayout(this).apply {
                  elementos.forEach { (t, a) ->
                      addView(Button(context).apply {
                          texto = t; tamañoTexto = 11f; estáEnMayúsculas = falso
                          setOnClickListener { a() }
                      }, LinearLayout.LayoutParams(0, -2, 1f))
                  }
              }

              private fun swatches(colors: List<IntArray>, onPick: (IntArray) -> Unit) = LinearLayout(this).apply {
                  colores.paraCada { c ->
                      addView(View(context).apply {
                          fondo = android.graphics.drawable.GradientDrawable(
                              android.graphics.drawable.GradientDrawable.Orientation.TOP_BOTTOM, c
                          ).apply { cornerRadius = dp(10).toFloat(); setStroke(dp(1), 0x55888888) }
                          setOnClickListener { onPick(c) }
                      }, LinearLayout.LayoutParams(0, dp(44), 1f).apply { setMargins(dp(4), 0, dp(4), 0) })
                  }
              }

              private fun render(w: Int, h: Int): Bitmap {
                  val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  val c = Canvas(bmp)
                  val p = Paint().apply { shader = LinearGradient(0f, 0f, 0f, h.toFloat(), bg[0], bg[1], Shader.TileMode.CLAMP) }
                  c.drawRect(0f, 0f, w.toFloat(), h.toFloat(), p)
                  val tp = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                      color = color del texto
                      Tamaño del texto = valor del tamaño * w / 1080f
                      tipo de letra = si (negrita) Tipo de letra.DEFAULT_BOLD sino Tipo de letra.DEFAULT
                      setShadowLayer(textSize * 0.15f, 0f, textSize * 0.04f, 0x66000000)
                  }
                  val texto = editar.texto.toString().ifEmpty { " " }
                  val tw = (w * 0.8f).toInt()
                  val layout = StaticLayout.Builder.obtain(text, 0, text.length, tp, tw)
                      .setAlignment(align).build()
                  c.guardar()
                  c.translate(w * 0.1f, h * posVal / 100f - layout.height / 2f)
                  diseño.draw(c)
                  c.restore()
                  devolver bmp
              }

              privado divertido refresh() {
                  si (!::preview.isInitialized || !::edit.isInitialized) devolver
                  val dm = resources.displayMetrics
                  preview.setImageBitmap(render(dm.widthPixels / 3, dm.heightPixels / 3))
              }

              private fun applyToLockScreen(e: android.content.SharedPreferences.Editor) {
                  val dm = resources.displayMetrics
                  intentar {
                      val bmp = render(dm.widthPixels, dm.heightPixels)
                      WallpaperManager.getInstance(this)
                          .setBitmap(bmp, null, true, WallpaperManager.FLAG_LOCK)
                      e.putString("texto", edit.text.toString()).apply()
                      Toast.makeText(this, "Listo: bloquea el móvil para verlo", Toast.LENGTH_LONG).show()
                  } catch (ej: Excepción) {
                      Toast.makeText(this, "No se pudo cambiar el fondo: ${ex.message}", Toast.LENGTH_LONG).show()
                  }
              }
          }
          EOF_FILE
      - nombre: Compilar
        ejecutar: cd proj && gradle assembleDebug --no-daemon
      - nombre: Publicar APK
        entorno:
          GH_TOKEN: ${{ github.token }}
        correr: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk TextoBloqueo.apk
          gh release create "v${{ github.run_number }}" TextoBloqueo.apk --repo "${{ github.repository }}" --title "APK v${{ github.run_number }}" --notes "Descarga TextoBloqueo.apk"
